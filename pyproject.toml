[project]
name = "realtime-analytics-backend"
version = "1.0.0"
description = "Real-Time Analytics FastAPI Backend"
requires-python = ">=3.11"

dependencies = [
    "fastapi[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "python-dotenv",
    "python-jose",
    "passlib[bcrypt]",
]

[tool.fastapi]
entrypoint = "app.main:app"